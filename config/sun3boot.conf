# Sun-3 netboot configuration -- the single source of truth.
#
# Edit this file, then re-run scripts/03-configure.sh.  Everything under etc/,
# tftpboot/ and nfsroot/ is generated from these values and may be deleted at
# any time.
#
# This file is sourced by /bin/sh.  Keep it to plain VAR=value assignments.

# --------------------------------------------------------------- the clients
#
# One whitespace-separated line per machine:
#
#     <name>   <MAC>               <IP>            <arch>  [payload]
#
#   name   short hostname.  Also names nfsroot/<name>/ and the bootparams
#          entry, so it must be unique.
#   MAC    as printed by the PROM at power-on ("Ethernet address 8:0:20:x:x:x")
#          or by its "banner" command.  Sun's OUI is 08:00:20.
#   IP     a free address on SERVER_IF's own subnet -- everything after RARP is
#          routed IP, so an off-subnet client gets its address and then goes
#          silent.  The PROM TFTPs the file named after this address in
#          uppercase hex, so 192.168.0.121 -> C0A80079.  An emulated client
#          takes its address from RARP like a real one, so this is the only
#          place it is set: nothing changes on the guest side.
#   arch   sun3  = 68020: 3/50 3/60 3/110 3/150 3/160 3/260  (bare hex name)
#          sun3x = 68030: 3/80 3/460 3/470 3/480             (name gets .SUN3X)
#          sun2  = 68010: Multibus Sun-2                     (name gets .SUN2)
#   payload  what the machine boots.  Optional fifth column; the last two are
#            sun2 only.  Alternatives per machine, so changing the word and
#            re-running scripts/03-configure.sh switches a machine over.
#              netbsd   (default) NetBSD 10.1, a RAMDISK kernel carrying its
#                       own root filesystem
#              sunos    SunOS 4.0.3, root over NFSv2.  README, "SunOS on the
#                       Sun-2"
#              netbsd2  NetBSD 2.0.2, a DISKLESS kernel with a real root over
#                       NFSv2.  README, "NetBSD 2.0.2 with a real root"
#
# A Sun-2 PROM does no RARP and no TFTP: it loads its bootstrap over ND (the
# Network Disk protocol) and learns its address from the first ND reply.
# scripts/01-build-ndbootd.sh builds a server for that.  See README,
# "A Sun-2".
#
# Blank lines and #-comments inside the table are ignored.  Re-run
# scripts/03-configure.sh after editing; it rewrites every generated file for
# every client listed here.

CLIENTS='
sun3	08:00:20:11:22:33	192.168.0.121	sun3
sun3b	08:00:20:51:45:4D	192.168.0.122	sun3
sun2_f_m	08:00:20:01:06:e0	192.168.0.123	sun2	sunos
sun2b	08:00:20:01:06:e1	192.168.0.124	sun2	netbsd2
'

# ---------------------------------------------------------------- the server

# The interfaces the clients are on, space separated.  Only rarpd cares: it
# needs a raw socket per segment, everything else binds 0.0.0.0 and is routed.
# With more than one, start.sh runs rarpd with -a, which answers on whichever
# interface the request arrived on.
#
# Real hardware is on eno1; the emulated machine is on br0, a bridge over the
# emulator's tap.  br0 carries SERVER_IP too (added "noprefixroute", with a host
# route for the guest only), so eno1 keeps the subnet route and the default
# route and is never reconfigured.
SERVER_IF='eno1 br0'

# The address the clients are told to fetch their kernel from.  It must be an
# address of this host reachable from every segment in SERVER_IF.
SERVER_IP=192.168.0.31

# ---------------------------------------------------------------- the payload

# netbsd = download NetBSD/sun3 automatically (02-fetch-payload.sh)
# custom = you supply the files yourself; set CUSTOM_* below
PAYLOAD=netbsd

NETBSD_RELEASE=10.1

# Which kernel to serve over NFS.  RAMDISK carries its own root filesystem, so
# it boots to a usable prompt without needing a real NFS root -- that is what
# makes milestone M3 reachable without solving the /dev problem first.
#   netbsd-RAMDISK   ramdisk root, install/rescue tools   (recommended first)
#   netbsd-INSTALL   ramdisk root, runs sysinst directly
#   netbsd-GENERIC   needs a real NFS root                (milestone M4)
# For CLIENT_ARCH=sun3x append "3X", e.g. netbsd-RAMDISK3X.
NETBSD_KERNEL=netbsd-RAMDISK

# The kernel for sun2 clients, from the sun2 distribution -- a Sun-2 cannot run
# the sun3 kernel above.  Only fetched when the table has a sun2 in it.
# RAMDISK carries its own root, so nothing else is needed in the client root.
#   netbsd-RAMDISK   ramdisk root, install/rescue tools   (recommended first)
#   netbsd-INSTALL   ramdisk root, runs sysinst directly
#   netbsd-DISKLESS  needs a real NFS root
NETBSD_KERNEL_SUN2=netbsd-RAMDISK

# --- payload=netbsd2 -------------------------------------------------------
#
# NetBSD 10.1 dropped nothing a Sun-2 needs, but its userland no longer fits
# one: 4MB of RAM and a 68010.  The 2.x line is the last whose sun2 binaries
# are worth running on the hardware, and it is only in the archive, so it has
# its own release number rather than sharing NETBSD_RELEASE.
#
# 2.0.2 is the last 2.0 release built for sun2: 2.0.3 exists, but the archive
# has only its source, no binaries for any architecture.  2.1 has sun2
# binaries too if you want to go past the 2.0 line.
NETBSD2_RELEASE=2.0.2

# DISKLESS is the sun2 kernel built to mount its root over NFS; RAMDISK and
# INSTALL carry their own and would ignore the tree scripts/04-make-netbsd2-
# root.sh unpacks.  GENERIC wants a local disk.
NETBSD2_KERNEL_SUN2=netbsd-DISKLESS

# The distribution sets unpacked into the root.  base and etc are what it
# takes to boot to a login prompt; comp, man, misc, text and games are the
# rest of the release and cost 30MB or so more.
NETBSD2_SETS='base etc'

# A diskless SunOS client asks bootparams for "swap" as well as "root", and
# retries forever if it is not answered -- it mounts root, sizes it, and then
# stops there.  This is the size of the swap file 03-configure.sh creates for
# each sunos client; it is sparse, so it costs nothing until written to.
# A Sun-2 holds at most 4MB of RAM, so this is already generous.
SUNOS_SWAP_MB=16

# --------------------------------------------------------------- NFS ports
#
# 2049 is the well-known NFS port, and SunOS assumes it: its boot asks the
# portmapper for mountd and then sends NFS straight to 2049 without looking it
# up.  So the NFSv2 server has to be the one there, or SunOS gets unfs3 and
# a "RPC: Program/version mismatch".
#
# NetBSD looks both up through the portmapper, so unfs3 can be anywhere.
NFS2D_PORT=2049

# The transfer size nfs2d advertises to SunOS clients, in the tsize field of
# STATFS: "the number of bytes the server would like to have in the data part
# of READ and WRITE requests" (RFC 1094).  1024 keeps a whole reply inside one
# Ethernet frame, which is a reasonable thing to ask of a 1989 client on a
# 10Mbit wire.  Advisory, and a SunOS kernel mounting its root ignores it --
# but the userland above it does honour it, and writes in 1024-byte pieces.
NFS2D_TSIZE=1024
UNFSD_PORT=2050

# Where the SunOS 4.0.3 sun2 boot programs come from, for payload=sunos.  Read
# only -- 02-fetch-payload.sh copies out of it and verifies its SHA256SUMS, and
# never writes to it.  Relative paths are taken from the boot directory.
SUNOS_NETBOOT_DIR=../Sun-2_DiskImage/netboot

# Also download the miniroot image (only needed to install onto a local disk).
NETBSD_FETCH_MINIROOT=no

# --- PAYLOAD=custom only (e.g. SunOS 4.1.x from your own media) -------------
# Paths are relative to the boot directory.  Read the "SunOS" section of
# README.md first: a SunOS 4.x boot program speaks NFSv2, which unfsd does not
# -- tools/nfs2d.py is what serves that.
#CUSTOM_NETBOOT=payload/boot.sun3
#CUSTOM_KERNEL=payload/vmunix
